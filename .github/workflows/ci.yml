name: CI

# Every push to main and every pull request: the same checks a release runs, minus the release itself.
# The published exe is uploaded as a workflow artifact so a build can be tried without cutting a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Version helper tests
        run: ./tests/version-tests.ps1

      # src/Packet.cs against tests/ref_se.py: 51,713 frames must be byte-identical.
      - name: Packet identity (C# frames == Python reference)
        run: ./tests/run-packet-tests.ps1

      - name: Publish (win-x64, framework-dependent, single file)
        run: dotnet publish deepcool-lite.csproj -c Release -o artifacts/publish

      - name: Check the published exe
        run: |
          $v = ./scripts/version.ps1 -Get
          ./scripts/check-exe.ps1 -Path artifacts/publish/deepcool-lite.exe -ExpectedVersion $v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepcool-lite-win-x64
          path: artifacts/publish/deepcool-lite.exe
          if-no-files-found: error
          retention-days: 14
